name: Release

# Релиз выходит сам после зелёного CI на main. Версию считает tools/reliz
# по коммитам с последнего тега: feat поднимает минорную версию, fix и
# perf — патч, «!» или BREAKING CHANGE — мажорную (до 1.0 — минорную).
# Если с последнего тега были только docs, ci, chore и подобные коммиты,
# релиз не выходит. Заметки к релизу собираются из сообщений коммитов.
# Тег от GITHUB_TOKEN не запускает другие workflow, поэтому тег,
# GoReleaser и проверка установки живут здесь же.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: версия
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          # Если тег уже стоит на этом коммите, а релиза нет, прошлый
          # прогон упал после тега: доделываем этот релиз.
          tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
          if [ -n "$tag" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "Релиз $tag уже есть." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$tag" ]; then
            tag=$(go run ./tools/reliz next)
          fi
          if [ -z "$tag" ]; then
            echo "Выпускать нечего: с последнего тега нет feat, fix, perf и ломающих изменений." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: заметки к релизу
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          go run ./tools/reliz notes --tag "$TAG" > "$RUNNER_TEMP/notes.md"
          { echo "## $TAG"; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: тег
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "balanda $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: GoReleaser
        if: steps.version.outputs.tag != ''
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-check:
    name: install-check (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BALANDA_VERSION: ${{ needs.release.outputs.tag }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: curl | sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | sh
          "$HOME/.local/bin/balanda" version | tee version.txt
          grep -q "balanda ${TAG#v}" version.txt

      - name: irm | iex
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:TAG/install.ps1" | iex
          $out = & "$env:LOCALAPPDATA\Programs\balanda\balanda.exe" version
          $out
          if (-not ($out -match "balanda $($env:TAG.TrimStart('v'))")) { throw "поставилась не та версия" }
