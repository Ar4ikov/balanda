name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Тег и релиз от GITHUB_TOKEN не запускают другие workflow, поэтому
  # GoReleaser работает здесь же и догружает файлы в релиз release-please.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-check:
    name: install-check (${{ matrix.os }})
    needs: [release-please, goreleaser]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BALANDA_VERSION: ${{ needs.release-please.outputs.tag_name }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: curl | sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | sh
          "$HOME/.local/bin/balanda" version | tee version.txt
          grep -q "balanda ${TAG#v}" version.txt

      - name: irm | iex
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:TAG/install.ps1" | iex
          $out = & "$env:LOCALAPPDATA\Programs\balanda\balanda.exe" version
          $out
          if (-not ($out -match "balanda $($env:TAG.TrimStart('v'))")) { throw "поставилась не та версия" }
