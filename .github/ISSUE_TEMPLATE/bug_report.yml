name: Ошибка
description: balanda работает не так, как написано в README или в --help
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что пишете. Чем точнее шаги, тем быстрее найдётся причина.
  - type: textarea
    id: version
    attributes:
      label: Вывод balanda version
      render: text
      placeholder: |
        balanda 0.1.0
        коммит:    ...
        собрано:   ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: ОС
      options:
        - Linux
        - macOS
        - Windows
        - другая
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Архитектура
      options:
        - amd64 (x86_64)
        - arm64 (aarch64, Apple Silicon)
        - другая
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Версия ОС
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
  - type: dropdown
    id: install
    attributes:
      label: Как установлена
      options:
        - install.sh
        - install.ps1
        - пакет .deb
        - пакет .rpm
        - пакет .apk
        - go install
        - архив из релиза вручную
        - собрана из исходников
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Команда
      description: Что запускали, целиком, с флагами.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что получили
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: |
        Вывод команды целиком. Для камер пригодится `balanda shmon <камера>`
        и журнал фоновой камеры: ~/.local/state/balanda/kamery/<номер>.err.
      render: text
