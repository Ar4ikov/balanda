version: "2"

linters:
  default: standard
  exclusions:
    presets:
      - std-error-handling
  enable:
    - errorlint
    - nolintlint
    - unconvert
    - misspell
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Ar4ikov/balanda
